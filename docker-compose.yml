# Docker Compose pour le développement local et la recette.
# Par défaut : infrastructure seule (MariaDB, phpMyAdmin, Mailpit), le back et le front tournent via `make`.
# Profil `full` : ajoute le back et le front en images (`make full`).
# Les identifiants de la base viennent de backend/.env (source unique, via --env-file dans le Makefile).

name: skyjo

services:
  # Même image que la base de production (service MariaDB de Dokploy)
  db:
    image: mariadb:13
    container_name: skyjo-db-dev
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-skyjo}
      MARIADB_USER: ${DB_USER:-olivier}
      MARIADB_PASSWORD: ${DB_PASSWORD:-olivier}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin
    container_name: skyjo-phpmyadmin-dev
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "8080:80"
    depends_on:
      - db

  # Serveur SMTP de dev/recette : capture tous les mails, aucun n'est réellement envoyé
  mailpit:
    image: axllent/mailpit
    container_name: skyjo-mailpit-dev
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # interface web
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  backend:
    profiles: [full]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skyjo-backend-dev
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_HOST: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    profiles: [full]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BACKEND_HOST: http://localhost:3000
        VITE_BACKEND_WS: http://localhost:3000
    container_name: skyjo-frontend-dev
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  db_data:
