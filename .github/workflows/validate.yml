name: Validate

# Lint, tests et build bloquants sur chaque push (hors main) et chaque PR vers dev ou main.
# Aussi appelé par release.yml avant de construire les images.
on:
  workflow_call:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    # Tests d'API du back : MariaDB comme en prod (base skyjo_test créée par test/global-setup.ts) et Mailpit
    services:
      db:
        image: mariadb:13
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: skyjo
          MARIADB_USER: skyjo
          MARIADB_PASSWORD: skyjo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: skyjo
      DB_USER: skyjo
      DB_PASSWORD: skyjo
      DB_ROOT_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Lint
        run: |
          cd backend && npm run lint
          cd ../frontend && npm run lint

      - name: Tests
        run: |
          cd backend && npm test
          cd ../frontend && npm test

      - name: Build
        run: |
          cd backend && npm run build
          cd ../frontend && npm run build
