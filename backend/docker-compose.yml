# Docker Compose pour le développement local
# Lance une base de données MySQL, PHPMyAdmin et Mailpit (capture des mails)

services:
  mysql:
    image: mysql:8.4
    container_name: skyjo-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: skyjo
      MYSQL_USER: olivier
      MYSQL_PASSWORD: olivier
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin
    container_name: skyjo-phpmyadmin-dev
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql

  # Serveur SMTP de dev/recette : capture tous les mails, aucun n'est réellement envoyé
  mailpit:
    image: axllent/mailpit
    container_name: skyjo-mailpit-dev
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # interface web
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  mysql_data:
