name: Release

# Seule la publication d'une release GitHub (tag vX.Y.Z sur main) déploie en production :
# validation, images Docker Hub (version + latest), puis webhooks Dokploy (back d'abord : migrations).
on:
  release:
    types: [published]

permissions:
  contents: read

# Une seule mise en production à la fois
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  guard:
    name: Vérifie la release
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag vX.Y.Z sur main
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Le tag $GITHUB_REF_NAME n'est pas de la forme vX.Y.Z"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag $GITHUB_REF_NAME ne pointe pas sur un commit de main"
            exit 1
          fi

  validate:
    needs: guard
    uses: ./.github/workflows/validate.yml

  images:
    name: Image ${{ matrix.app }}
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/skyjo-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          # Seul le back lit APP_VERSION, seul le front lit les VITE_* (les args en trop sont ignorés)
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VITE_APP_VERSION=${{ steps.meta.outputs.version }}
            VITE_BACKEND_HOST=${{ vars.VITE_BACKEND_HOST }}
            VITE_BACKEND_WS=${{ vars.VITE_BACKEND_WS }}

  deploy:
    name: Déploiement Dokploy
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Backend
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_BACKEND }}
        run: curl -fsS -X POST "$WEBHOOK"

      - name: Frontend
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_FRONTEND }}
        run: curl -fsS -X POST "$WEBHOOK"
